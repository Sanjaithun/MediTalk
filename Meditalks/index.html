            --border-color: rgba(255, 255, 255, 0.2);
        }
        html[data-theme="light"] {
            --bg-primary: #f3f4f6; --bg-secondary: #ffffff; --bg-glass: rgba(255, 255, 255, 0.7);
            --text-primary: #111827; --text-secondary: #4b5563; --accent-color: #3b82f6;
            --border-color: rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        .glass-card {
            background: var(--bg-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }
        .nav-button.active { background-color: var(--accent-color); color: white; }
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .ai-response-content h3 {
            font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-top: 0.75rem;
            margin-bottom: 0.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem;
        }
         .ai-response-content h3:first-child { margin-top: 0; }

</head>

    };
    
    // --- UI SETUP & EVENT LISTENERS ---
    const themeButtons = document.querySelectorAll('.theme-btn');
    const setTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('meditalk_theme', theme);
        themeButtons.forEach(btn => { btn.style.borderColor = btn.dataset.theme === theme ? 'var(--accent-color)' : 'var(--border-color)'; });
    };
    themeButtons.forEach(button => button.addEventListener('click', () => setTheme(button.dataset.theme)));

    const langButtons = document.querySelectorAll('.lang-btn');
    const setLanguage = (lang) => {
        currentLang = lang; localStorage.setItem('meditalk_lang', lang);
        document.querySelectorAll('[data-translate-key]').forEach(el => { el.innerHTML = translations[lang][el.dataset.translateKey] || ''; });
        if (recognition) { recognition.lang = {en: 'en-US', ta: 'ta-IN', te: 'te-IN', hi: 'hi-IN'}[lang]; }
        langButtons.forEach(btn => { btn.style.backgroundColor = btn.dataset.lang === lang ? 'var(--accent-color)' : 'transparent'; });
        chatInput.placeholder = {en: 'Type your symptoms here...', ta: 'உங்கள் அறிகுறிகளை இங்கே தட்டச்சு செய்க...', te: 'మీ లక్షణాలను ఇక్కడ టైప్ చేయండి...', hi: 'अपने लक्षण यहां टाइप करें...'}[lang];
    };
    langButtons.forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));

    const updateVoiceButton = () => {
        if (isVoiceEnabled) { voiceIcon.className = 'fas fa-volume-up'; voiceToggleBtn.style.backgroundColor = 'var(--accent-color)'; } 
        else { voiceIcon.className = 'fas fa-volume-mute'; voiceToggleBtn.style.backgroundColor = 'transparent'; }
    };
    voiceToggleBtn.addEventListener('click', () => {
        isVoiceEnabled = !isVoiceEnabled; localStorage.setItem('meditalk_voice', isVoiceEnabled);
        updateVoiceButton();
        if (!isVoiceEnabled) { synth.cancel(); }
    });

    const handleTextInput = () => {
        const command = chatInput.value.trim();
        if (command) { welcomeMessage.style.display = 'none'; addUserMessage(command); getAiResponse(command); chatInput.value = ''; }
    };
    sendBtn.addEventListener('click', handleTextInput);
    chatInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') { handleTextInput(); }});

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) { recognition.interimResults = false; }
    
    const toggleListening = () => {
        if (!recognition) { alert("Speech recognition not supported."); return; }
        synth.speak(new SpeechSynthesisUtterance(""));
        isListening = !isListening;
        if (isListening) { recognition.start(); } else { recognition.stop(); }
    };
    micButton.addEventListener('click', toggleListening);

    if (recognition) {
        recognition.onstart = () => { isListening = true; micButton.classList.add('pulse'); statusText.innerText = translations[currentLang].status_listening; };
        recognition.onend = () => { isListening = false; micButton.classList.remove('pulse'); statusText.innerText = translations[currentLang].status_tap_to_speak; };
        recognition.onresult = (event) => { const command = event.results[0][0].transcript; welcomeMessage.style.display = 'none'; addUserMessage(command); getAiResponse(command); };
    }
    
    // --- CHAT UI FUNCTIONS ---
    const addUserMessage = (text) => {
        const messageHtml = `<div class="flex justify-end"><div class="bg-[var(--accent-color)] text-white p-3 rounded-lg max-w-xs md:max-w-md">${text}</div></div>`;
        chatArea.insertAdjacentHTML('beforeend', messageHtml); chatArea.scrollTop = chatArea.scrollHeight;
    };
    const addAiMessage = (htmlContent, imageUrl) => {
        document.getElementById('loading-skeleton')?.remove();
        const imageHtml = imageUrl ? `<img src="${imageUrl}" alt="Relevant Image" class="w-full h-40 object-cover">` : '';
        const cleanHtmlContent = htmlContent.replace(/\*/g, ''); // Remove all asterisks
        const messageHtml = `<div class="flex justify-start"><div class="glass-card rounded-lg max-w-xs md:max-w-md overflow-hidden">${imageHtml}<div class="p-3 ai-response-content">${cleanHtmlContent}</div></div></div>`;
        chatArea.insertAdjacentHTML('beforeend', messageHtml); chatArea.scrollTop = chatArea.scrollHeight;
    };
     const showLoadingSkeleton = () => {
        const skeletonHtml = `<div id="loading-skeleton" class="flex justify-start"><div class="glass-card p-3 rounded-lg max-w-xs md:max-w-md w-full animate-pulse"><div class="bg-[var(--text-secondary)]/30 h-40 rounded-t-lg"></div><div class="p-3 space-y-2"><div class="bg-[var(--text-secondary)]/30 h-4 rounded-md"></div><div class="bg-[var(--text-secondary)]/30 h-4 w-5/6 rounded-md"></div></div></div></div>`;
        chatArea.insertAdjacentHTML('beforeend', skeletonHtml); chatArea.scrollTop = chatArea.scrollHeight;
    };

    // --- TEXT-TO-SPEECH (TTS) FUNCTION ---
    const synth = window.speechSynthesis;
    function speak(text, lang) {
        if (!isVoiceEnabled || !text) return;
        if (synth.speaking) { synth.cancel(); }
        
        const cleanText = text.replace(/\*/g, ''); // Clean asterisks before speaking
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const voices = synth.getVoices();
        let voiceToUse = null;

        if (lang === 'ta') {
            // Per your request, use an English voice for the special transliterated Tamil text
            voiceToUse = voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB');
        } else {
            // For other languages, try to find the native voice
            const langCode = { en: 'en-US', te: 'te-IN', hi: 'hi-IN' }[lang];
            voiceToUse = voices.find(v => v.lang === langCode);
        }

        // If a specific voice isn't found, fall back to the first available English voice
        if (!voiceToUse) {
            voiceToUse = voices.find(v => v.lang.startsWith('en'));
        }
        
        utterance.voice = voiceToUse;
        synth.speak(utterance);
    }

    // --- MAIN AI RESPONSE ORCHESTRATOR ---
    async function getAiResponse(prompt) {
        showLoadingSkeleton();
        statusText.innerText = translations[currentLang].status_thinking;
        try {
            const [aiData, imageUrl] = await Promise.all([
                getAiUnifiedResponse(prompt),
                getImageForQuery(prompt)
            ]);
            
            const formattedText = aiData.displayText.replace(/### (.*?)\n/g, '<h3>$1</h3>');
            
            addAiMessage(formattedText, imageUrl);
            speak(aiData.speechText, aiData.detectedLang);
            
        } catch (error) {
            console.error(error);
            addAiMessage("An error occurred. Please check API keys or rate limits.");
        } finally {
             statusText.innerText = translations[currentLang].status_tap_to_speak;
        }
    }

    // --- UNIFIED AI FUNCTION (1 API CALL) ---
    async function getAiUnifiedResponse(prompt) {
        const megaPrompt = `
            ANALYZE the user's query: "${prompt}"
            STEP 1: Detect the primary language (en, ta, te, or hi).
            STEP 2: Generate a health response in the detected language, structured with three headings: Recommendation, Suggestion, and Solutions (use native language spelling for headings). The response text MUST NOT contain any Markdown asterisks. Include a disclaimer.
            STEP 3: Generate the text for speech.
              - If Tamil ('ta'), provide a phonetically accurate roman character transliteration of the Tamil response.
              - For all other languages, the speech text is the SAME as the display text.
            STEP 4: Format your final output strictly as a JSON object:
            {"detectedLang": "...", "displayText": "...", "speechText": "..."}
        `;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: megaPrompt }] }] })
        });
        
        if (!response.ok) throw new Error("Gemini API request failed");
        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        
        const jsonString = rawText.replace(/```json\n|```/g, '').trim();
        return JSON.parse(jsonString);
    }
    
    // --- GOOGLE IMAGE SEARCH ---
    async function getImageForQuery(query) {
       const searchUrl = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_SEARCH_API_KEY}&cx=${GOOGLE_SEARCH_CX}&q=${encodeURIComponent(query + " health")}&searchType=image&num=1`;
        try {
            const searchResponse = await fetch(searchUrl);
            if (!searchResponse.ok) return null;
            const searchData = await searchResponse.json();
            return searchData.items && searchData.items.length > 0 ? searchData.items[0].link : null;
        } catch (error) { console.error("Image search failed:", error); return null; }
    }
    
    // --- NEARBY HOSPITALS ---
    findHospitalsBtn.addEventListener('click', () => {
        hospitalsList.innerHTML = `<p class="text-center">${translations[currentLang].hospitals_searching}</p>`;
        navigator.geolocation.getCurrentPosition(async (position) => {
            const { latitude, longitude } = position.coords;
            const placesUrl = `https://maps.googleapis.com/maps/api/place/nearbysearch/json?location=${latitude},${longitude}&radius=5000&type=hospital&key=${GOOGLE_MAPS_API_KEY}`;
            try {
                const response = await fetch(placesUrl);
                const data = await response.json();
                hospitalsList.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    data.results.slice(0, 10).forEach(place => {
                        const hospitalEl = document.createElement('div');
                        hospitalEl.className = 'glass-card p-4 rounded-lg';
                        hospitalEl.innerHTML = `<h3 class="font-bold text-lg">${place.name}</h3><p class="text-[var(--text-secondary)]">${place.vicinity}</p>`;
                        hospitalsList.appendChild(hospitalEl);
                    });
                } else { hospitalsList.innerHTML = `<p class="text-center">${translations[currentLang].hospitals_none_found}</p>`; }
            } catch (error) {
                 hospitalsList.innerHTML = `<p class="text-center text-red-400">${translations[currentLang].hospitals_error}</p>`;
            }
        }, () => {
             hospitalsList.innerHTML = `<p class="text-center text-red-400">${translations[currentLang].hospitals_denied}</p>`;
        });
    });

    // --- FIRST AID ACCORDION ---
    document.querySelectorAll('.accordion-header').forEach(header => {
        header.addEventListener('click', () => {
            const content = header.nextElementSibling;
            content.classList.toggle('hidden');
            header.querySelector('i').classList.toggle('rotate-180');
        });
    });

    // --- APP INITIALIZATION ---
    setTheme(currentTheme);
    setLanguage(currentLang);
    updateVoiceButton();
    showPage('symptom-checker');
});

// --- GLOBAL PAGE NAVIGATION ---
const showPage = (pageId) => {
    document.querySelectorAll('.page-content').forEach(page => page.classList.add('hidden'));
    document.getElementById(pageId + '-page').classList.remove('hidden');
    document.querySelectorAll('.nav-button').forEach(btn => {
        if (btn.onclick.toString().includes(pageId)) { btn.classList.add('active'); } 
        else { btn.classList.remove('active'); }
    });
};
</script>
