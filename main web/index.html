<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTalk AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Custom Scrollbar */
        #chat-area::-webkit-scrollbar { width: 6px; }
        #chat-area::-webkit-scrollbar-track { background: transparent; }
        #chat-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        #chat-area::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
        /* Pulse Animation */
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(4, 211, 97, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(4, 211, 97, 0); }
            100% { box-shadow: 0 0 0 0 rgba(4, 211, 97, 0); }
        }
        /* Fade-in Animation */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Modal Animation */
        .modal-enter { animation: modalIn 0.3s forwards; }
        .modal-leave { animation: modalOut 0.3s forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes modalOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen overflow-hidden bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900">

    <div class="flex h-full">
        <aside class="hidden md:flex flex-col w-64 bg-gray-800/50 p-4 space-y-4">
            <div class="text-2xl font-bold text-center mb-4">MediTalk AI</div>
            <button class="flex items-center space-x-2 p-3 rounded-lg hover:bg-blue-500/30 transition-colors"><i class="fas fa-check-circle w-5"></i><span>Symptom Checker</span></button>
            <button id="reminder-btn" class="flex items-center space-x-2 p-3 rounded-lg hover:bg-blue-500/30 transition-colors"><i class="fas fa-bell w-5"></i><span>Medication Reminders</span></button>
            <button class="flex items-center space-x-2 p-3 rounded-lg hover:bg-blue-500/30 transition-colors"><i class="fas fa-book-medical w-5"></i><span>Health Records</span></button>
            <div class="flex-grow"></div>
            <button class="flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-700/50 transition-colors"><i class="fas fa-cog w-5"></i><span>Settings</span></button>
        </aside>

        <div class="flex flex-col flex-1">
            <header class="glass-card flex justify-between items-center p-4 shadow-md">
                <div class="md:hidden text-2xl font-bold">MediTalk AI</div>
                <div id="health-tip" class="hidden md:block text-sm text-gray-300 italic"></div>
                <button id="clear-chat-btn" class="bg-red-500/50 hover:bg-red-500/80 p-2 rounded-full transition-colors"><i class="fas fa-trash"></i></button>
            </header>

            <main id="chat-area" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div id="welcome-message" class="text-center my-auto fade-in">
                    <div class="inline-block glass-card p-6 rounded-xl shadow-lg">
                        <i class="fas fa-robot text-4xl text-blue-300 mb-4"></i>
                        <h2 class="text-xl font-semibold mb-2">Your AI Health Companion</h2>
                        <p class="text-gray-300">Tap the microphone and ask me anything about your health.</p>
                    </div>
                </div>
                </main>

            <footer class="p-4">
                <div class="flex justify-center items-center">
                    <button id="mic-button" class="bg-blue-600 text-white rounded-full p-6 transition-all duration-300 ease-in-out transform hover:scale-110 focus:outline-none shadow-lg">
                        <i id="mic-icon" class="fas fa-microphone-alt text-4xl"></i>
                    </button>
                </div>
                <p id="status-text" class="text-center text-gray-400 mt-2 text-sm transition-opacity">Tap to Speak</p>
                <div class="text-center text-xs text-gray-500 mt-3">
                    
                    <a href="https://sanjaithun.netlify.app/" class="underline hover:text-blue-400 transition-colors">
                    <span>Powered by Sanjaithun</span>
                   </a>
                </div>
            </footer>
        </div>
    </div>
    
    <div id="reminder-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden">
        <div class="glass-card p-8 rounded-lg w-11/12 md:w-1/3 modal-enter">
            <h2 class="text-2xl font-bold mb-4">Set a Reminder</h2>
            <div class="space-y-4">
                <input type="text" placeholder="Medication Name (e.g., Vitamin C)" class="w-full bg-gray-700 p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="time" class="w-full bg-gray-700 p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-4 mt-6">
                <button id="cancel-reminder" class="px-4 py-2 bg-gray-600/50 rounded-md hover:bg-gray-600 transition-colors">Cancel</button>
                <button id="set-reminder" class="px-4 py-2 bg-blue-600 rounded-md hover:bg-blue-500 transition-colors">Set Reminder</button>
            </div>
            
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const micButton = document.getElementById('mic-button');
            const micIcon = document.getElementById('mic-icon');
            const statusText = document.getElementById('status-text');
            const chatArea = document.getElementById('chat-area');
            const welcomeMessage = document.getElementById('welcome-message');
            const clearChatBtn = document.getElementById('clear-chat-btn');
            const healthTipEl = document.getElementById('health-tip');
            const reminderBtn = document.getElementById('reminder-btn');
            const reminderModal = document.getElementById('reminder-modal');
            const cancelReminderBtn = document.getElementById('cancel-reminder');
            const setReminderBtn = document.getElementById('set-reminder');
            
            // --- API KEYS ---
            // IMPORTANT: Replace with your actual API keys
        const GEMINI_API_KEY = "AIzaSyAgTgnYzr9LbzSF5GSHYdgk5nTyhXEa1I0";
        const GOOGLE_SEARCH_API_KEY = "AIzaSyCVMVTJwLvSC7XJjTMuh1XpOiCJht8QbTg";
        const GOOGLE_SEARCH_CX = "149fc2eb221274d84";


            // --- State ---
            let isListening = false;
            
            // --- Speech Recognition Setup ---
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Sorry, your browser doesn't support Speech Recognition. Please use Google Chrome.");
            }
            const recognition = new SpeechRecognition();
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            // --- Text-to-Speech Setup ---
            const synth = window.speechSynthesis;

            // --- Event Listeners ---
            micButton.addEventListener('click', toggleListening);
            clearChatBtn.addEventListener('click', clearChat);
            reminderBtn.addEventListener('click', () => showModal(true));
            cancelReminderBtn.addEventListener('click', () => showModal(false));
            setReminderBtn.addEventListener('click', () => {
                alert('Reminder set! (This is a demo)');
                showModal(false);
            });

            // --- Core Functions ---
            function toggleListening() {
                isListening = !isListening;
                if (isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            }
            
            function showModal(show) {
                if(show) {
                    reminderModal.classList.remove('hidden');
                    reminderModal.querySelector('div').classList.add('modal-enter');
                    reminderModal.querySelector('div').classList.remove('modal-leave');
                } else {
                    reminderModal.querySelector('div').classList.remove('modal-enter');
                    reminderModal.querySelector('div').classList.add('modal-leave');
                    setTimeout(() => reminderModal.classList.add('hidden'), 300);
                }
            }

            // --- Recognition Handlers ---
            recognition.onstart = () => {
                isListening = true;
                micButton.classList.add('pulse', 'bg-red-600');
                micButton.classList.remove('bg-blue-600');
                micIcon.classList.add('fa-fade');
                statusText.textContent = "Listening...";
                statusText.style.opacity = '1';
            };

            recognition.onend = () => {
                isListening = false;
                micButton.classList.remove('pulse', 'bg-red-600');
                micButton.classList.add('bg-blue-600');
                micIcon.classList.remove('fa-fade');
                statusText.textContent = "Tap to Speak";
                setTimeout(() => statusText.style.opacity = '1', 500);
            };

            recognition.onerror = (event) => {
                statusText.textContent = "Error: " + event.error;
            };

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript;
                welcomeMessage.style.display = 'none';
                addUserMessage(command);
                showLoadingSkeleton();
                processCommand(command);
            };
            
            // --- UI Manipulation ---
            function addUserMessage(text) {
                const messageHtml = `
                    <div class="flex justify-end fade-in">
                        <div class="bg-blue-600 p-3 rounded-lg max-w-xs md:max-w-md">
                            <p>${text}</p>
                        </div>
                    </div>`;
                chatArea.insertAdjacentHTML('beforeend', messageHtml);
                chatArea.scrollTop = chatArea.scrollHeight;
            }

            function addAiMessage(text, imageUrl) {
                document.getElementById('loading-skeleton')?.remove();
                const imageHtml = imageUrl ? `<img src="${imageUrl}" alt="Relevant image" class="w-full h-40 object-cover rounded-t-lg mb-2" onerror="this.style.display='none'">` : '';
                const messageHtml = `
                    <div class="flex justify-start fade-in">
                        <div class="glass-card rounded-lg max-w-xs md:max-w-md">
                            ${imageHtml}
                            <div class="p-3">
                                <p>${text}</p>
                                <div class="flex justify-end space-x-2 mt-2 text-gray-400 text-sm">
                                    <button class="hover:text-white" onclick="copyText(this)"><i class="fas fa-copy"></i></button>
                                    <button class="hover:text-white" onclick="speakText(this)"><i class="fas fa-volume-up"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                chatArea.insertAdjacentHTML('beforeend', messageHtml);
                chatArea.scrollTop = chatArea.scrollHeight;
            }
            
            function showLoadingSkeleton() {
                const skeletonHtml = `
                    <div id="loading-skeleton" class="flex justify-start fade-in">
                        <div class="glass-card rounded-lg max-w-xs md:max-w-md w-full animate-pulse">
                            <div class="bg-gray-700/50 h-40 rounded-t-lg"></div>
                            <div class="p-3 space-y-2">
                                <div class="bg-gray-700/50 h-4 rounded-md"></div>
                                <div class="bg-gray-700/50 h-4 w-5/6 rounded-md"></div>
                                <div class="bg-gray-700/50 h-4 w-3/4 rounded-md"></div>
                            </div>
                        </div>
                    </div>`;
                chatArea.insertAdjacentHTML('beforeend', skeletonHtml);
                chatArea.scrollTop = chatArea.scrollHeight;
            }

            function clearChat() {
                chatArea.innerHTML = '';
                welcomeMessage.style.display = 'block';
                speak("Conversation cleared.");
            }

            // --- API Calls ---
            async function processCommand(command) {
                statusText.textContent = "Thinking...";
                
                try {
                    if (GEMINI_API_KEY.includes("PASTE") || GOOGLE_SEARCH_API_KEY.includes("PASTE")) {
                        throw new Error("API keys not set.");
                    }
                    const [aiText, imageUrl] = await getAiResponseWithImage(command);
                    addAiMessage(aiText, imageUrl);
                    speak(aiText);
                } catch (error) {
                    console.error("Error:", error);
                    const errorMessage = error.message === "API keys not set."
                        ? "Please configure your API keys in the code to enable AI features."
                        : "Sorry, I encountered an error. Please try again.";
                    addAiMessage(errorMessage);
                    speak(errorMessage);
                }
            }

            async function getAiResponseWithImage(prompt) {
                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const systemInstruction = `You are MediTalk, a friendly AI health assistant. Provide clear, helpful answers (max 4 sentences). Always include a disclaimer: "This is for informational purposes only. Consult a doctor for medical advice."`;

                const geminiResponse = await fetch(geminiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        system_instruction: { parts: [{ text: systemInstruction }] }
                    })
                });
                if (!geminiResponse.ok) throw new Error('Gemini API request failed');
                const geminiData = await geminiResponse.json();
                if (!geminiData.candidates || geminiData.candidates.length === 0) {
                     throw new Error("No response from AI. The query may have been blocked for safety reasons.");
                }
                const aiText = geminiData.candidates[0].content.parts[0].text;

                const imageSearchQuery = await generateImageQuery(prompt);
                const searchUrl = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_SEARCH_API_KEY}&cx=${GOOGLE_SEARCH_CX}&q=${encodeURIComponent(imageSearchQuery)}&searchType=image&num=1`;
                
                const searchResponse = await fetch(searchUrl);
                if (!searchResponse.ok) throw new Error('Google Search API request failed');
                const searchData = await searchResponse.json();
                const imageUrl = searchData.items && searchData.items.length > 0 ? searchData.items[0].link : null;

                return [aiText, imageUrl];
            }
            
            async function generateImageQuery(prompt) {
                const queryGenUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const queryGenPrompt = `Based on the user's health query "${prompt}", create a simple 2-3 word Google Image search query for a relevant, helpful, SFW (safe-for-work) image. For example, for "symptoms of a common cold", a good query is "person sneezing tissue". For "healthy diet", a good query is "healthy food plate". Respond with ONLY the search query.`;
                const response = await fetch(queryGenUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: queryGenPrompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text.trim();
            }
            
            // --- Utility Functions ---
            function speak(text, callback) {
                synth.cancel(); // Stop any previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                if (callback) utterance.onend = callback;
                synth.speak(utterance);
            }

            function displayHealthTip() {
                const tips = [
                    "Stay hydrated! Aim for 8 glasses of water a day.",
                    "A 30-minute walk each day can boost your mood and health.",
                    "Prioritize 7-9 hours of quality sleep per night.",
                    "Eat a variety of colorful fruits and vegetables daily.",
                    "Take short breaks to stretch if you sit for long periods."
                ];
                healthTipEl.textContent = `💡 Tip: ${tips[Math.floor(Math.random() * tips.length)]}`;
            }
            
            // --- Initialize App ---
            displayHealthTip();
        });

        // --- Global functions for inline HTML buttons ---
        function copyText(element) {
            const textToCopy = element.closest('.p-3').querySelector('p').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function speakText(element) {
            const textToSpeak = element.closest('.p-3').querySelector('p').innerText;
            const synth = window.speechSynthesis;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            synth.speak(utterance);
        }
    </script>
</body>
</html>
